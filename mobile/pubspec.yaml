name: english_udaan
description: Urdu-first English learning app for Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.1.0
  go_router: ^17.1.0
  shared_preferences: ^2.5.4
  flutter_tts: ^4.2.5
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_background: "#087B7D"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F7F9F9"
  color_dark: "#0B191A"
  image: assets/branding/splash_logo.png
  android: true
  ios: false
  android_12:
    color: "#F7F9F9"
    color_dark: "#0B191A"
    image: assets/branding/splash_logo.png
    icon_background_color: "#087B7D"
    icon_background_color_dark: "#087B7D"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/content/alphabet_sample.json
    - assets/content/vocabulary_sample.json
    - assets/content/picture_learning_sample.json
    - assets/content/sentences_paragraphs_sample.json
    - assets/content/grammar_sample.json
